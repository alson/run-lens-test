[project]
name = "macro-lens-test"
version = "0.1.0"
description = "Automated macro lens sharpness testing on Nikon Z7 + StackShot rig"
requires-python = ">=3.12"
dependencies = [
    "pyserial>=3.5",
    "gphoto2>=2.6.0",
    "pillow>=11.0",
    "numpy>=2.0",
    "requests>=2.32",
    "lens-test-detect-core",
    "pyftdi>=0.57.1",
    "questionary>=2.0",
    # Pinned to 1.x for libjpeg-turbo 2.x compatibility (Ubuntu 22.04 etc.).
    # PyTurboJPEG 2.x requires libjpeg-turbo 3.0+, which Arch ships but
    # Ubuntu LTS does not.
    "PyTurboJPEG>=1.7,<2",
]

[tool.uv.sources]
lens-test-detect-core = { path = "../lens-test-detect-core", editable = true }

[project.scripts]
macro-lens-test = "session.runner:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["camera", "exposure", "notify", "session", "sharpness", "stackshot", "ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
